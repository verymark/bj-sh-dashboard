name: Daily Beijing-Shanghai Dashboard

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        run: python scripts/collect_data.py

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Build Ministry of Finance RSS
        env:
          PRIVATE_FEED_PATH: ${{ secrets.MOF_RSS_PATH }}
        run: |
          test -n "$PRIVATE_FEED_PATH"
          python scripts/build_mof_rss.py \
            --output "docs/$PRIVATE_FEED_PATH" \
            --feed-url "https://verymark.github.io/bj-sh-dashboard/$PRIVATE_FEED_PATH"

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "chore: update daily statistics feeds"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload private Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
